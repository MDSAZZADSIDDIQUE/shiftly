name: shiftly

# Single-VM deployment (see README → Deploy). Self-hosted Supabase (database, auth, REST, realtime) and the app sit
# behind an internal Caddy gateway on 127.0.0.1:3600; the host's Caddy terminates HTTPS for $DOMAIN and proxies to it.
# Secrets live in /etc/shiftly/shiftly.env, linked as .env next to this file. Image versions match the Supabase CLI
# used for local development, so migrations and the seed behave the same.

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.11.0.002
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, log_min_messages=fatal]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: 3600
    volumes:
      # First start only: role passwords, JWT expiry setting and the realtime schema.
      - ./db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://${DOMAIN:?}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: https://${DOMAIN}
      GOTRUE_URI_ALLOW_LIST: https://${DOMAIN}/**
      # Accounts are created by the manager (or the seed), never by sign-up.
      GOTRUE_DISABLE_SIGNUP: 'true'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?}
      GOTRUE_JWT_ISSUER: https://${DOMAIN}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      # No mail server: accounts are confirmed on creation.
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_MAILER_URLPATHS_INVITE: https://${DOMAIN}/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: https://${DOMAIN}/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: https://${DOMAIN}/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: https://${DOMAIN}/auth/v1/verify
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: 'true'
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:9999/health]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rest:
    image: public.ecr.aws/supabase/postgrest:v16.4
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
      PGRST_ADMIN_SERVER_PORT: 3001
      # The health check (postgrest --ready) asks the admin server on localhost.
      PGRST_ADMIN_SERVER_HOST: localhost
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  realtime:
    image: public.ecr.aws/supabase/realtime:v2.140.3
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:?}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: '10000'
      APP_NAME: realtime
      # Creates the single tenant "realtime-dev"; the gateway sends that name in the Host header.
      SEED_SELF_HOST: 'true'
      RUN_JANITOR: 'true'
      DISABLE_HEALTHCHECK_LOGGING: 'true'
    healthcheck:
      test: [CMD-SHELL, 'curl -sSfL --head -o /dev/null -H "Authorization: Bearer ${ANON_KEY}" http://localhost:4000/api/tenants/realtime-dev/health']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: ./src
      args:
        NEXT_PUBLIC_SUPABASE_URL: https://${DOMAIN}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY:?}
    image: shiftly-app
    environment:
      NEXT_PUBLIC_SUPABASE_URL: https://${DOMAIN}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
      SUPABASE_SECRET_KEY: ${SERVICE_ROLE_KEY:?}
      # Each business is a subdomain of this; the bare domain is the platform admin area.
      ROOT_DOMAIN: ${DOMAIN}
      # What the Terminals page tells you to type into the terminal (host Caddy serves /iclock/* on plain HTTP).
      DEVICE_SERVER_PORT: '80'
    # Server-side Supabase calls go to the public URL; resolve it to this host so they don't leave the VM.
    extra_hosts:
      - ${DOMAIN}:host-gateway
    depends_on: [auth, rest, realtime]
    restart: unless-stopped

  gateway:
    image: caddy:2-alpine
    volumes:
      - ./gateway.Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - '127.0.0.1:3600:80'
    depends_on: [app, auth, rest, realtime]
    restart: unless-stopped

volumes:
  db-data:
  db-config:
